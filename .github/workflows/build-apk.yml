name: Build and Release Signed V2 Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          echo "Detected Java Major Version: $JAVA_VER"
          if [ -z "$JAVA_VER" ] || [ "$JAVA_VER" -lt 21 ]; then
            echo "Error: Java 21 or newer is required for AGP 9.1.1"
            exit 1
          fi

      - name: Pre-build Credential Diagnostics
        env:
          ANWESHA_KEYSTORE_BASE64: ${{ secrets.ANWESHA_KEYSTORE_BASE64 }}
          ANWESHA_KEYSTORE_PASSWORD: ${{ secrets.ANWESHA_KEYSTORE_PASSWORD }}
          ANWESHA_KEY_PASSWORD: ${{ secrets.ANWESHA_KEY_PASSWORD }}
        run: |
          echo "=========================================="
          echo "RUNNING PRE-BUILD CREDENTIAL DIAGNOSTICS"
          echo "=========================================="

          # Check secret references
          if [ -z "$ANWESHA_KEYSTORE_BASE64" ] || [ -z "$ANWESHA_KEYSTORE_PASSWORD" ] || [ -z "$ANWESHA_KEY_PASSWORD" ]; then
            echo "SECRET_REFERENCE = FAIL"
            echo "Error: One or more required GitHub Secrets (ANWESHA_KEYSTORE_BASE64, ANWESHA_KEYSTORE_PASSWORD, ANWESHA_KEY_PASSWORD) are empty or not configured."
            exit 1
          else
            echo "SECRET_REFERENCE = PASS"
          fi

          # Check environment variable presence
          if [ -n "$ANWESHA_KEYSTORE_PASSWORD" ] && [ -n "$ANWESHA_KEY_PASSWORD" ]; then
            echo "PASSWORD_ENVIRONMENT = PASS"
          else
            echo "PASSWORD_ENVIRONMENT = FAIL"
            exit 1
          fi

          KEYSTORE_DIR="$RUNNER_TEMP/keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_FILE="$KEYSTORE_DIR/anwesha-release.jks"

          printf '%s' "$ANWESHA_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE" 2>/dev/null

          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "KEYSTORE_IDENTITY = FAIL"
            echo "Error: Failed to decode a valid non-empty keystore file from ANWESHA_KEYSTORE_BASE64."
            exit 1
          fi

          # Test Keystore Password directly as received in environment
          if keytool -list -keystore "$KEYSTORE_FILE" -storepass:env ANWESHA_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            echo "STORE_PASSWORD_TEST = PASS"
          else
            echo "STORE_PASSWORD_TEST = FAIL"
            echo "Error: ANWESHA_KEYSTORE_PASSWORD provided by GitHub Actions secrets cannot unlock the keystore."
            echo "Diagnostic Reason: The secret value configured in GitHub repository settings does not match the keystore password."
            exit 1
          fi

          # Verify Key Password
          if keytool -list -v -keystore "$KEYSTORE_FILE" -alias "anwesha_release" -storepass:env ANWESHA_KEYSTORE_PASSWORD -keypass:env ANWESHA_KEY_PASSWORD >/dev/null 2>&1; then
            echo "KEY_PASSWORD_TEST = PASS"
          else
            echo "KEY_PASSWORD_TEST = FAIL"
            echo "Error: ANWESHA_KEY_PASSWORD provided by GitHub Actions secrets cannot unlock alias 'anwesha_release'."
            exit 1
          fi

          # Verify Keystore Certificate Identity
          EXPECTED_DIGEST="D9C5751B1E6DFE842CE7C3D115E459BA50B8873265CE59CF5CAF8F511D21873A"
          ACTUAL_DIGEST=$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias "anwesha_release" -storepass:env ANWESHA_KEYSTORE_PASSWORD 2>/dev/null | grep -i "SHA256:" | head -n 1 | awk -F'SHA256:' '{print $2}' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')

          echo "Expected: $EXPECTED_DIGEST"
          echo "Actual  : $ACTUAL_DIGEST"

          if [ "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST" ]; then
            echo "KEYSTORE_IDENTITY = PASS"
            echo "CERTIFICATE = PASS"
          else
            echo "KEYSTORE_IDENTITY = FAIL"
            echo "CERTIFICATE = FAIL"
            echo "Error: Certificate SHA-256 fingerprint does not match the expected release certificate."
            exit 1
          fi

          echo "=========================================="
          echo "ALL PRE-BUILD DIAGNOSTICS PASSED"
          echo "=========================================="
          echo "keystore_path=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Signed Release APK
        env:
          ANWESHA_KEYSTORE_PATH: ${{ env.keystore_path }}
          ANWESHA_KEYSTORE_PASSWORD: ${{ secrets.ANWESHA_KEYSTORE_PASSWORD }}
          ANWESHA_KEY_ALIAS: anwesha_release
          ANWESHA_KEY_PASSWORD: ${{ secrets.ANWESHA_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify Signed Release APK
        id: verify_apk
        run: |
          TARGET_APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected release APK not found at $TARGET_APK"
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" -type f || true
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: Release APK is empty"
            exit 1
          fi

          echo "Successfully verified existence: $TARGET_APK"

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ] && [ -x "$APKSIGNER_BIN" ]; then
            echo "Verifying APK with apksigner ($APKSIGNER_BIN)..."
            "$APKSIGNER_BIN" verify --verbose "$TARGET_APK"
            "$APKSIGNER_BIN" verify --print-certs "$TARGET_APK"
          else
            echo "apksigner not found directly in Android SDK path, proceeding with verified build output."
          fi

          echo "apk_path=$TARGET_APK" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anwesha-v2-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          TARGET_APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$TARGET_APK" ] || [ ! -s "$TARGET_APK" ]; then
            echo "Error: Release APK file does not exist or is empty at $TARGET_APK"
            exit 1
          fi

          RELEASE_TAG="anwesha-v2-release-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Anwesha V2 Release #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ## Anwesha V2 Release

          - **Version Name**: 2.0
          - **Version Code**: 2
          - **Application ID**: com.aistudio.anwesha.school
          - **Build Type**: Signed Release APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit**: ${GITHUB_SHA}
          - **Signing Key**: anwesha_release (anwesha-release.jks)

          This APK is intended as an update to the previous Anwesha version.
          It is signed using the existing permanent Anwesha release certificate (SHA-256: \`D9:C5:75:1B:1E:6D:FE:84:2C:E7:C3:D1:15:E4:59:BA:50:B8:87:32:65:CE:59:CF:5C:AF:8F:51:1D:21:87:3A\`).
          EOF
          )

          gh release create "$RELEASE_TAG" "$TARGET_APK" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          RELEASE_TAG="anwesha-v2-release-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=========================================="
            echo "V2 RELEASE SUCCESSFUL"
            echo "=========================================="
            gh release view "$RELEASE_TAG" || true
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release URL: $RELEASE_URL"
            echo "APK Filename: app-release.apk"

            echo "### 🚀 V2 Release Published Successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag**: \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release URL**: [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Asset**: \`app-release.apk\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact**: \`anwesha-v2-release-apk\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=========================================="
            echo "WARNING: RELEASE PUBLISHING FAILED"
            echo "=========================================="
            echo "APK build succeeded. Download from Actions Artifacts → anwesha-v2-release-apk"

            echo "### ⚠️ GitHub Release Publishing Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "Release APK build succeeded, but GitHub Release creation failed." >> "$GITHUB_STEP_SUMMARY"
            echo "Download the APK directly from **Actions Artifacts** as **anwesha-v2-release-apk**." >> "$GITHUB_STEP_SUMMARY"
          fi
