name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode Keystore
        env:
          ANWESHA_KEYSTORE_BASE64: ${{ secrets.ANWESHA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "${{ runner.temp }}/keystore"
          if [ -n "$ANWESHA_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANWESHA_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "${{ runner.temp }}/keystore/anwesha-release.jks"
          elif [ -f "anwesha-release.keystore.base64" ]; then
            tr -d '\r\n ' < anwesha-release.keystore.base64 | base64 -d > "${{ runner.temp }}/keystore/anwesha-release.jks"
          elif [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > "${{ runner.temp }}/keystore/anwesha-release.jks"
          fi

      - name: Build Signed Release APK
        env:
          ANWESHA_KEYSTORE_PATH: ${{ runner.temp }}/keystore/anwesha-release.jks
          ANWESHA_KEYSTORE_PASSWORD: ${{ secrets.ANWESHA_KEYSTORE_PASSWORD || 'anwesha123' }}
          ANWESHA_KEY_ALIAS: ${{ secrets.ANWESHA_KEY_ALIAS || 'anwesha_school_key' }}
          ANWESHA_KEY_PASSWORD: ${{ secrets.ANWESHA_KEY_PASSWORD || secrets.ANWESHA_KEYSTORE_PASSWORD || 'anwesha123' }}
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK Signature
        run: |
          TARGET_DIR="app/build/outputs/apk/release"
          mkdir -p "$TARGET_DIR"
          TARGET_APK="$TARGET_DIR/anwesha-release.apk"

          FOUND_APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
            cp "$FOUND_APK" "$TARGET_APK"
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Release APK not found in build outputs"
            find app/build/outputs -type f || true
            exit 1
          fi

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ] && [ -x "$APKSIGNER_BIN" ]; then
            echo "Verifying APK with apksigner ($APKSIGNER_BIN)..."
            "$APKSIGNER_BIN" verify --verbose "$TARGET_APK"
            "$APKSIGNER_BIN" verify --print-certs "$TARGET_APK"
          else
            echo "apksigner not found, skipping signature verification step."
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anwesha-release
          path: app/build/outputs/apk/release/anwesha-release.apk
          if-no-files-found: error

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -rf "${{ runner.temp }}/keystore"
