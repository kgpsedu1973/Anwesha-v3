name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode Keystore
        env:
          ANWESHA_KEYSTORE_BASE64: ${{ secrets.ANWESHA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "${{ runner.temp }}/keystore"
          printf '%s' "$ANWESHA_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "${{ runner.temp }}/keystore/anwesha-release.jks"

      - name: Build Signed Release APK
        env:
          ANWESHA_KEYSTORE_PATH: ${{ runner.temp }}/keystore/anwesha-release.jks
          ANWESHA_KEYSTORE_PASSWORD: ${{ secrets.ANWESHA_KEYSTORE_PASSWORD }}
          ANWESHA_KEY_ALIAS: ${{ secrets.ANWESHA_KEY_ALIAS || 'anwesha_school_key' }}
          ANWESHA_KEY_PASSWORD: ${{ secrets.ANWESHA_KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Verify APK Signature
        run: |
          TARGET_APK="app/build/outputs/apk/release/anwesha-release.apk"
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"

          if [ -f "$SOURCE_APK" ]; then
            cp "$SOURCE_APK" "$TARGET_APK"
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Release APK not found at $TARGET_APK"
            exit 1
          fi

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ] && [ -x "$APKSIGNER_BIN" ]; then
            echo "Verifying APK with apksigner ($APKSIGNER_BIN)..."
            "$APKSIGNER_BIN" verify --verbose "$TARGET_APK"
            "$APKSIGNER_BIN" verify --print-certs "$TARGET_APK"
          else
            echo "apksigner not found, skipping signature verification step."
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anwesha-release
          path: app/build/outputs/apk/release/anwesha-release.apk
          if-no-files-found: error

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -rf "${{ runner.temp }}/keystore"
